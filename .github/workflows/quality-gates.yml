name: quality-gates

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-file-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check test file coverage
        run: bash scripts/check-test-coverage.sh

  frontend-lint-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend unit tests with coverage
        run: npm run test:coverage

      - name: Frontend critical regressions
        run: npm run test:regressions

      - name: Diff coverage check (new/changed code ≥ 90%)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          npx diff-cover coverage/lcov.info \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=90

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: uv sync --project backend --extra dev

      - name: Backend unit tests
        run: |
          if [ -d "backend/tests/unit" ]; then
            uv run --project backend python -m pytest backend/tests/unit -v
            code=$?; [ $code -eq 5 ] && echo "No unit tests yet, skipping." || exit $code
          else
            echo "backend/tests/unit not found — skipping unit tests for now."
          fi

  backend-api-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: uv sync --project backend --extra dev

      - name: API integration tests with coverage
        run: uv run --project backend python -m pytest backend/tests/integration -v --cov=backend/app --cov-report=xml:coverage.xml

      - name: Diff coverage check (new/changed code ≥ 90%)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          uv run --project backend diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=90

  python-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install root dependencies
        run: uv sync --extra dev

      - name: Baseline tests
        run: uv run pytest tests/ -v

      - name: Evals tests
        run: uv run pytest evals/ -v
