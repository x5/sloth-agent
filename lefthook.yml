# lefthook.yml — Git hooks for test coverage enforcement
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    test-file-gate:
      run: bash scripts/check-test-coverage.sh
    frontend-lint-fix:
      glob: "frontend/src/**/*.{ts,tsx}"
      run: cd frontend && npm run lint:fix && (git add -u src/ || exit 0)
      stage_fixed: true
